name: Avengers IMAX Afragola

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Invia un solo avviso di prova tramite GitHub'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - monitor.py
      - test_monitor.py
      - requirements.txt
      - .github/workflows/monitor.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: happy-imax-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installazione browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verifica filtro e deduplicazione
        run: python -m unittest -v
      - name: Controllo catalogo e avvisi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || false }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python monitor.py --test-notification
          else
            python monitor.py
          fi
